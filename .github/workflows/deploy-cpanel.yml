name: Deploy to cPanel (Standalone, FTP only)

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Standalone doesn't include static assets or public/ — add them
      - name: Assemble standalone output
        run: |
          if [ -d "public" ]; then
            cp -R public .next/standalone/public
          fi
          cp -R .next/static .next/standalone/.next/static
          cp .env.production .next/standalone/.env.production
          # Ship a DEPENDENCY-FREE package.json. The standalone server requires its
          # bundled files directly, so it needs no deps at runtime — and stripping
          # them means an accidental cPanel "Run NPM Install" is a harmless no-op
          # instead of failing to git-clone the private @spurs-cloud SDK.
          node -e "const p=require('./package.json');require('fs').writeFileSync('.next/standalone/package.json',JSON.stringify({name:p.name,version:p.version,private:true,scripts:{start:'node server.js'}},null,2))"

      # Passenger restarts when it sees an updated tmp/restart.txt
      - name: Add restart trigger
        run: |
          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt
          printf '%s\n' 'server.js' > .next/standalone/passenger.cjs

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local-dir: ./.next/standalone/
          server-dir: /
          protocol: ftps
          # ONE-TIME: forces a clean full upload and resets the FTP sync-state.
          # The prior deploys (which excluded node_modules) left a stale state that
          # made the incremental sync 550 when node_modules newly appeared. After the
          # first successful run, set this back to false so deploys are incremental
          # again. It wipes only the deploy target dir (app artifacts, all re-uploaded).
          dangerous-clean-slate: true
          # DO NOT exclude node_modules: `output: standalone` ships a minimal,
          # self-contained node_modules (next, react, sharp…) inside .next/standalone.
          # Excluding it left the server without Next.js → 503, and forced a manual
          # `npm install` on cPanel that then failed cloning the SDK over SSH.
          # The SDK is bundled into the server chunks, so nothing installs on the server.
          exclude: |
            **/.git/**
            **/.next/cache/**
