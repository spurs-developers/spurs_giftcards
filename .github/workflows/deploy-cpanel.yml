name: Deploy to cPanel (Standalone, FTP only)

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # Standalone doesn't include static assets or public/ — add them
      - name: Assemble standalone output
        run: |
          if [ -d "public" ]; then
            cp -R public .next/standalone/public
          fi
          cp -R .next/static .next/standalone/.next/static
          cp .env.production .next/standalone/.env.production
          cp package.json .next/standalone/package.json

      # Passenger restarts when it sees an updated tmp/restart.txt
      - name: Add restart trigger
        run: |
          mkdir -p .next/standalone/tmp
          date > .next/standalone/tmp/restart.txt
          printf '%s\n' 'server.js' > .next/standalone/passenger.cjs

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_HOST }}
          username: ${{ secrets.CPANEL_USERNAME }}
          password: ${{ secrets.CPANEL_PASSWORD }}
          local-dir: ./.next/standalone/
          server-dir: /
          protocol: ftps
          exclude: |
            **/.git/**
            **/node_modules/**
            **/.next/cache/**
